name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated code that nothing commits, and both the
      # typecheck and the build import types from it.
      - run: npx prisma generate

      - run: npm run typecheck

      # Only the tests that need no database. The suite skips the rest unless
      # ASKARR_TEST_DB=1 and the database name contains "test", a guard that
      # exists because the dev database holds real credentials.
      - run: npm test

      - run: npm run build
        env:
          # Not read at build time, but the schema parse wants a valid URL if
          # anything touches it while prerendering.
          APP_URL: http://localhost:3000

  # Both images, built and thrown away.
  #
  # Nothing else compiles a Dockerfile any more: images are published only when
  # the "chore(release): version packages" PR merges, so without this a broken
  # Dockerfile would surface while cutting a release, which is the worst
  # possible moment to find it. amd64 only and no push, because this is a
  # syntax-and-dependencies check rather than a build of anything anyone gets.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [docker/Dockerfile, docker/Dockerfile.lxc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
